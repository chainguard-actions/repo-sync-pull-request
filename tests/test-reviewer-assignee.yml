name: Test reviewer and assignee inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          source_branch: act-harness
          destination_branch: main
          pr_title: "Test PR with reviewer and assignee"
          pr_body: "Testing reviewer and assignee inputs"
          pr_reviewer: "octocat"
          pr_assignee: "octocat"
          github_token: ${{ github.token }}
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_URL: ${{ steps.action.outputs.pr_url }}
          PR_CREATED: ${{ steps.action.outputs.pr_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr_url: $PR_URL"
          echo "pr_created: $PR_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
