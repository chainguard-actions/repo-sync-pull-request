name: Test draft pull request creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          source_branch: act-harness
          destination_branch: main
          pr_title: "Draft PR from act test"
          pr_body: "This is a draft pull request created by act."
          pr_draft: "true"

      - name: Assert action ran for draft PR (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_URL: ${{ steps.action.outputs.pr_url }}
          PR_NUMBER: ${{ steps.action.outputs.pr_number }}
          PR_CREATED: ${{ steps.action.outputs.pr_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr_url: $PR_URL"
          echo "pr_number: $PR_NUMBER"
          echo "pr_created: $PR_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded creating draft PR"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
